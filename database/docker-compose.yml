services:
  postgres:
    image: postgres:16
    container_name: arav_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arav
      POSTGRES_USER: arav_user
      POSTGRES_PASSWORD: arav_pass
    ports:
      - "5432:5432"
    volumes:
      - arav_pgdata:/var/lib/postgresql/data

volumes:
  arav_pgdata:
